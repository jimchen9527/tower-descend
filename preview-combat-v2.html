<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>战斗预览 v2 · 半写实立绘 · 无动效</title>
<style>
/* ============================================================
   战斗预览 v2 —— 在 v1（杀戮尖塔式左右版式）基础上：
   ① 角色形象换成 AI 半写实立绘（preview-assets/*-cut.png，透明底）
   ② 按用户要求：动态效果全部去掉（无待机浮动 / 无突进 / 无抖动飘字）
      保留可交互的状态变化（点卡出牌、选目标、血量即时结算）
   ============================================================ */
:root {
  --bg: #F1EFE8;
  --panel: #FFFFFF;
  --ink: #2C2C2A;
  --hint: #888780;
  --line: #D3D1C7;
  --digger: #5F5E5A;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  overflow-x: hidden;
}

/* ---------- 顶栏 ---------- */
header {
  width: 100%;
  max-width: 1180px;
  padding: 14px 20px 0;
  display: flex;
  align-items: center;
  gap: 14px;
  flex-wrap: wrap;
}
header h1 { font-size: 15px; font-weight: 600; margin: 0; letter-spacing: .02em; }
header .note { font-size: 12px; color: var(--hint); }
.toolbar { margin-left: auto; display: flex; gap: 8px; }
.toolbar button {
  font: 12.5px/1 "Segoe UI", "Microsoft YaHei", sans-serif;
  padding: 7px 13px; border-radius: 8px;
  border: 1px solid var(--line); background: var(--panel); color: var(--ink);
  cursor: pointer;
}
.toolbar button:hover { border-color: #A8A69C; }
.toolbar button.primary { background: var(--digger); border-color: var(--digger); color: #fff; }

/* ---------- 战斗舞台 ---------- */
.stage {
  position: relative;
  width: min(1180px, 96vw);
  height: 600px;
  margin: 8px auto 0;
  background: linear-gradient(180deg, #FBFAF6 0%, #F3F1E9 62%, #E7E4D8 100%);
  border: 1px solid var(--line);
  border-radius: 14px;
  overflow: hidden;
  box-shadow: inset 60px 0 80px -60px rgba(95,94,90,.18),
              inset -60px 0 80px -60px rgba(95,94,90,.18);
}
.stage::after {
  content: '';
  position: absolute; left: 0; right: 0; bottom: 40px; height: 1.5px;
  background: linear-gradient(90deg, transparent, rgba(95,94,90,.28) 18%, rgba(95,94,90,.28) 82%, transparent);
}
.stage::before {
  content: '';
  position: absolute; left: 4%; right: 4%; bottom: 0; height: 96px;
  background: linear-gradient(180deg, transparent, rgba(95,94,90,.10));
  pointer-events: none;
}

/* ---------- 单位（位图形象） ---------- */
.unit { position: absolute; display: flex; flex-direction: column; align-items: center; }
.unit img {
  display: block;
  /* 落影：drop-shadow 跟着立绘轮廓走，比椭圆色块自然 */
  filter: drop-shadow(0 16px 12px rgba(50,48,42,.32));
}
.unit.dead img { opacity: .16; filter: grayscale(1); }

#u-player { left: 6%; bottom: 46px; z-index: 3; }
#u-player img { height: 310px; }

#u-hound { right: 4%; bottom: 240px; z-index: 2; }
#u-hound img { width: 380px; }

#u-rats { right: 21%; bottom: 48px; z-index: 3; }
#u-rats img { width: 280px; /* 底部渐隐：把画进去的地面虚化掉 */ -webkit-mask-image: linear-gradient(180deg, #000 80%, transparent 100%); mask-image: linear-gradient(180deg, #000 80%, transparent 100%); }

/* ---------- 血条 / 格挡 / 名牌 ---------- */
.plate {
  margin-top: 4px; min-width: 180px;
  background: rgba(255,255,255,.95);
  border: 1px solid var(--line); border-radius: 9px;
  padding: 6px 10px 8px;
  box-shadow: 0 2px 8px rgba(60,58,52,.12);
}
.plate .pname { font-size: 12px; font-weight: 600; display: flex; justify-content: space-between; align-items: baseline; }
.plate .pname .tier { font-size: 10.5px; color: var(--hint); font-weight: 400; }
.hpbar {
  position: relative; height: 14px; margin-top: 5px;
  background: #E4E1D6; border-radius: 7px; overflow: hidden;
  border: 1px solid rgba(60,58,52,.14);
}
.hpbar .fill { position: absolute; inset: 0 auto 0 0; width: 100%; }
.enemy .fill { background: linear-gradient(180deg, #C4524C, #A03430); }
.player .fill { background: linear-gradient(180deg, #43976A, #2E7B50); }
.hpbar .txt {
  position: absolute; inset: 0; display: grid; place-items: center;
  font-size: 10.5px; font-weight: 600; color: #fff;
  text-shadow: 0 1px 2px rgba(0,0,0,.35);
}
.block-badge {
  position: absolute; top: -13px; left: -13px;
  display: none; align-items: center; gap: 3px;
  background: #5A7A99; color: #fff;
  font-size: 12px; font-weight: 700;
  padding: 3px 8px; border-radius: 20px;
  border: 2px solid #fff;
  box-shadow: 0 2px 6px rgba(60,58,52,.3);
}
.block-badge.show { display: flex; }
.block-badge svg { width: 13px; height: 13px; }

/* ---------- 意图 ---------- */
.intent-pill {
  position: absolute; top: -36px; left: 50%; transform: translateX(-50%);
  display: flex; align-items: center; gap: 5px;
  background: rgba(255,255,255,.95);
  border: 1px solid var(--line); border-radius: 20px;
  padding: 4px 11px; z-index: 6;
  font-size: 13px; font-weight: 700;
  box-shadow: 0 2px 6px rgba(60,58,52,.12);
  white-space: nowrap;
}
.intent-pill svg { width: 15px; height: 15px; }
.intent-pill.attack { color: #A32D2D; }
.intent-pill small { font-size: 10px; color: var(--hint); font-weight: 400; }

/* 目标选中环 */
.unit.enemy { cursor: pointer; }
.target-ring {
  position: absolute; left: 50%; top: 40%;
  width: 96%; height: 78%;
  transform: translate(-50%, -50%);
  border: 2.5px dashed transparent; border-radius: 50%;
  pointer-events: none;
}
.unit.enemy.targeted .target-ring { border-color: rgba(163,45,45,.7); }

/* 能量球 */
.energy {
  position: absolute; left: 2.5%; bottom: 30px;
  width: 56px; height: 56px; border-radius: 50%;
  background: radial-gradient(circle at 34% 30%, #E8574A, #B32E24 70%);
  border: 3px solid #fff;
  box-shadow: 0 3px 10px rgba(179,46,36,.4);
  display: grid; place-items: center;
  color: #fff; font-size: 17px; font-weight: 800;
  z-index: 7;
}

/* 状态文字（替代 v1 的飘字 —— 纯文本即时反馈，无动画） */
#log {
  position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
  font-size: 12.5px; color: var(--hint);
  background: rgba(255,255,255,.85);
  border: 1px solid var(--line); border-radius: 16px;
  padding: 5px 14px;
  max-width: 70%; text-align: center;
}

/* ---------- 手牌 ---------- */
.hand { display: flex; gap: 12px; align-items: flex-end; padding: 14px 0 18px; min-height: 186px; }
.card {
  width: 122px; height: 164px;
  background: var(--panel);
  border: 1.5px solid var(--line);
  border-top: 4px solid var(--ctype, var(--digger));
  border-radius: 10px;
  padding: 10px 10px 8px;
  cursor: pointer; position: relative;
  box-shadow: 0 2px 6px rgba(60,58,52,.12);
  display: flex; flex-direction: column;
  user-select: none;
}
.card:hover { box-shadow: 0 6px 14px rgba(60,58,52,.2); }
.card.empty { visibility: hidden; }
.card .cost {
  position: absolute; top: -10px; left: -8px;
  width: 27px; height: 27px; border-radius: 50%;
  background: radial-gradient(circle at 34% 30%, #E8574A, #B32E24 72%);
  border: 2px solid #fff; color: #fff;
  display: grid; place-items: center;
  font-size: 14px; font-weight: 800;
}
.card .cname { font-size: 13px; font-weight: 700; margin-top: 4px; }
.card .ckind { font-size: 10px; color: var(--ctype, var(--hint)); margin-top: 2px; font-weight: 600; letter-spacing: .05em; }
.card .ctext { font-size: 11px; line-height: 1.55; color: #55534C; margin-top: 7px; }
.card.atk { --ctype: #A32D2D; }
.card.skl { --ctype: #185FA5; }
.card.pwr { --ctype: #854F0B; }
.card.spent { opacity: .35; pointer-events: none; filter: grayscale(.7); }

.hint-bar { font-size: 12px; color: var(--hint); padding-bottom: 10px; }
</style>
</head>
<body>

<header>
  <h1>战斗预览 v2 · 半写实立绘</h1>
  <span class="note">形象换 AI 立绘（透明底 PNG）｜ 动效已全部去掉 ｜ 点敌人选目标、点手牌出牌，状态即时结算</span>
  <div class="toolbar">
    <button class="primary" id="btn-enemy">敌方回合</button>
    <button id="btn-reset">重置</button>
  </div>
</header>

<div class="stage" id="stage">
  <div id="log">点击敌人选定目标，点手牌打出</div>

  <div class="unit player" id="u-player">
    <img src="preview-assets/digger-cut.png" alt="掘者">
    <div class="plate">
      <div class="block-badge" id="block-badge"><svg viewBox="0 0 16 16" fill="currentColor"><path d="M8 1l6 2.4v5.2c0 3.9-3.4 6.8-6 7.8-2.6-1-6-3.9-6-7.8V3.4z"/></svg><b id="block-num">0</b></div>
      <div class="pname"><span>掘者</span><span class="tier">我方</span></div>
      <div class="hpbar"><div class="fill" id="hp-player"></div><div class="txt" id="hpt-player">72 / 80</div></div>
    </div>
  </div>
  <div class="energy" id="energy">3</div>

  <div class="unit enemy targeted" id="u-hound" data-key="hound">
    <div class="target-ring"></div>
    <div class="intent-pill attack" id="intent-hound"></div>
    <img src="preview-assets/hound-cut.png" alt="双头犬">
    <div class="plate">
      <div class="pname"><span>双头犬</span><span class="tier">精英</span></div>
      <div class="hpbar"><div class="fill" id="hp-hound"></div><div class="txt" id="hpt-hound">82 / 82</div></div>
    </div>
  </div>

  <div class="unit enemy" id="u-rats" data-key="rats">
    <div class="target-ring"></div>
    <div class="intent-pill attack" id="intent-rats"></div>
    <img src="preview-assets/rats-cut.png" alt="腐蚀鼠群">
    <div class="plate">
      <div class="pname"><span>腐蚀鼠群</span><span class="tier">小怪</span></div>
      <div class="hpbar"><div class="fill" id="hp-rats"></div><div class="txt" id="hpt-rats">34 / 40</div></div>
    </div>
  </div>
</div>

<div class="hand">
  <div class="card empty"></div>
  <div class="card atk" data-kind="strike">
    <div class="cost">1</div><div class="cname">打击</div><div class="ckind">攻击</div>
    <div class="ctext">造成 6 点伤害。</div>
  </div>
  <div class="card skl" data-kind="defend">
    <div class="cost">1</div><div class="cname">防御</div><div class="ckind">技能</div>
    <div class="ctext">获得 5 点格挡。</div>
  </div>
  <div class="card atk" data-kind="heavy">
    <div class="cost">2</div><div class="cname">重锤</div><div class="ckind">攻击</div>
    <div class="ctext">造成 14 点伤害。</div>
  </div>
  <div class="card pwr" data-kind="ritual">
    <div class="cost">1</div><div class="cname">燃燔</div><div class="ckind">能力</div>
    <div class="ctext">每回合开始时，力量 +1。</div>
  </div>
  <div class="card empty"></div>
</div>
<div class="hint-bar">立绘：preview-assets/（AI 生成 + 本地抠图）｜ 本页未动游戏本体任何代码</div>

<script src="js/ui/art.js"></script>
<script>
(function () {
  'use strict';
  // 意图图标仍复用图形库（静态 SVG，小面积图标比文字快）
  function pill(id, label) {
    document.getElementById(id).innerHTML = Art.intent('attack') + '<span>' + label + '</span><small>意图</small>';
  }
  pill('intent-hound', '9');
  pill('intent-rats', '4');

  var S = {
    player: { hp: 72, max: 80, block: 0 },
    hound:  { hp: 82, max: 82, block: 0 },
    rats:   { hp: 34, max: 40, block: 0 },
    energy: 3,
    target: 'hound',
  };
  function $(id) { return document.getElementById(id); }
  function log(t) { $('log').textContent = t; }

  function renderHp(k) {
    var st = S[k];
    $('hp-' + k).style.width = Math.max(0, st.hp / st.max * 100) + '%';
    $('hpt-' + k).textContent = Math.max(0, st.hp) + ' / ' + st.max;
  }
  function renderBlock() {
    $('block-num').textContent = S.player.block;
    $('block-badge').classList.toggle('show', S.player.block > 0);
  }
  function renderEnergy() { $('energy').textContent = S.energy; }
  function markDead(k) {
    if (S[k].hp <= 0) {
      var u = $('u-' + k);
      u.classList.add('dead');
      u.style.pointerEvents = 'none';
      var ip = u.querySelector('.intent-pill');
      if (ip) ip.style.display = 'none';
    }
  }

  function dealDamage(k, amount) {
    var st = S[k];
    var dmg = amount;
    if (st.block > 0) {
      var ab = Math.min(st.block, dmg);
      st.block -= ab; dmg -= ab;
      log(($('u-' + k).querySelector('.pname span').textContent) + ' 格挡了 ' + ab + ' 点');
    }
    if (dmg > 0) {
      st.hp -= dmg;
      log(($('u-' + k).querySelector('.pname span').textContent) + ' 受到 ' + dmg + ' 点伤害');
    }
    renderHp(k); renderBlock(); markDead(k);
  }

  document.querySelectorAll('.unit.enemy').forEach(function (u) {
    u.addEventListener('click', function () {
      document.querySelectorAll('.unit.enemy').forEach(function (x) { x.classList.remove('targeted'); });
      u.classList.add('targeted');
      S.target = u.dataset.key;
      log('目标已切换为 ' + u.querySelector('.pname span').textContent);
    });
  });

  var CARDS = {
    strike: { cost: 1, run: function () { if (S[S.target].hp > 0) dealDamage(S.target, 6); } },
    defend: { cost: 1, run: function () { S.player.block += 5; renderBlock(); log('掘者获得 5 点格挡'); } },
    heavy:  { cost: 2, run: function () { if (S[S.target].hp > 0) dealDamage(S.target, 14); } },
    ritual: { cost: 1, run: function () { log('燃燔：力量 +1（演示）'); } },
  };
  document.querySelectorAll('.card[data-kind]').forEach(function (c) {
    c.addEventListener('click', function () {
      if (c.classList.contains('spent')) return;
      var def = CARDS[c.dataset.kind];
      if (S.energy < def.cost) { log('能量不足'); return; }
      S.energy -= def.cost;
      renderEnergy();
      def.run();
      c.classList.add('spent');
    });
  });

  $('btn-enemy').addEventListener('click', function () {
    ['hound', 'rats'].forEach(function (k) {
      if (S[k].hp > 0) dealDamage('player', k === 'hound' ? 9 : 4);
    });
    S.energy = 3;
    renderEnergy();
    log('敌方回合结束，你的回合（能量已恢复）');
    document.querySelectorAll('.card.spent').forEach(function (c) { c.classList.remove('spent'); });
  });

  $('btn-reset').addEventListener('click', function () {
    S.player = { hp: 72, max: 80, block: 0 };
    S.hound = { hp: 82, max: 82, block: 0 };
    S.rats = { hp: 34, max: 40, block: 0 };
    S.energy = 3;
    ['player', 'hound', 'rats'].forEach(function (k) {
      $('u-' + k).classList.remove('dead');
      $('u-' + k).style.pointerEvents = '';
      var ip = $('u-' + k).querySelector('.intent-pill');
      if (ip) ip.style.display = '';
      renderHp(k);
    });
    renderBlock(); renderEnergy();
    document.querySelectorAll('.card.spent').forEach(function (c) { c.classList.remove('spent'); });
    document.querySelectorAll('.unit.enemy').forEach(function (x) { x.classList.remove('targeted'); });
    $('u-hound').classList.add('targeted');
    S.target = 'hound';
    log('已重置');
  });

  ['player', 'hound', 'rats'].forEach(renderHp);
  renderBlock();
  renderEnergy();
})();
</script>
</body>
</html>
